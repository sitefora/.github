<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">SiteFora — сайт, который упрощает работу бизнеса</title>
<desc id="desc">Брендированный баннер по концепции Geologica. Слева сообщение студии SiteFora, справа схема обработки заявки: новая заявка, уведомление в Telegram, ответ клиенту.</desc>
<defs>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7FAFF"/><stop offset=".67" stop-color="#EDF5FF"/><stop offset="1" stop-color="#DBEEFF"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#1463FF"/><stop offset="1" stop-color="#33C5F4"/></linearGradient>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#DDEBFF"/><stop offset="1" stop-color="#CAEAFE"/></linearGradient>
  <filter id="cardShadow" x="-25%" y="-35%" width="160%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B183F" flood-opacity=".11"/></filter>
</defs>
