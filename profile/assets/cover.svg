  <rect x="74" y="102" width="195" height="26" rx="13" fill="#E0ECFF"/>
  <text x="88" y="120" font-size="12" font-weight="700" letter-spacing=".4" fill="#1463FF">САЙТЫ · ИНТЕГРАЦИИ · АВТОМАТИЗАЦИЯ</text>
  <text x="74" y="200" font-size="54" font-weight="800" letter-spacing="-2" fill="#0B183F">Сайт, который</text>
  <text x="74" y="264" font-size="54" font-weight="800" letter-spacing="-2.2" fill="#0B183F">упрощает работу</text>
  <text x="74" y="328" font-size="54" font-weight="800" letter-spacing="-2" fill="#1463FF">бизнеса.</text>
  <rect x="75" y="343" width="200" height="5" rx="2.5" fill="#33C5F4"/>
  <text x="76" y="387" font-size="17" font-weight="500" fill="#35466B">Создаём сайты и автоматизируем</text>
  <text x="76" y="410" font-size="17" font-weight="500" fill="#35466B">заявки, уведомления и процессы.</text>
</g>
